<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>F1 Standings</title>
		<link rel="stylesheet" href="/style.css" />
	</head>
	<body>
		<header class="hero">
			<div class="hero-inner">
				<div class="logo">F<span class="accent">1</span></div>
				<h1 class="title">Driver Standings</h1>
				<button id="add-weekend-btn" class="primary-btn">Add Race Weekend</button>
			</div>
		</header>

		<main class="container">
			<div id="loading" class="loading">Loading standings…</div>

			<div class="table-wrap" id="standings-wrap" hidden>
				<table class="standings-table">
					<thead>
						<tr>
							<th>#</th>
							<th>Driver</th>
							<th>Nationality</th>
							<th>Team</th>
							<th>Points</th>
						</tr>
					</thead>
					<tbody id="standings-body"></tbody>
				</table>
			</div>

			<div id="error" class="error" hidden></div>

			<section id="details" class="details" hidden>
				<div id="details-container" class="details-container"></div>
			</section>
		</main>

		<footer class="footer">Data provided by the backend API</footer>

		<!-- Add Race Weekend modal (controlled by JS) -->
		<div id="add-weekend-modal" class="modal">
			<div class="modal-overlay" id="add-weekend-overlay"></div>
			<div class="modal-card" id="add-weekend-card">
				<header class="modal-card-header">
					<h2>Add Race Weekend</h2>
					<button id="add-weekend-close" class="card-close">×</button>
				</header>
				<div id="add-weekend-error" class="error" hidden></div>
				<div id="add-weekend-body" class="add-weekend-body"></div>
				<footer class="modal-card-footer">
					<button id="add-weekend-submit" class="primary-btn">Submit</button>
				</footer>
			</div>
		</div>

		<script src="/script.js"></script>
	</body>
</html>
